[package]
name = "btl_core"
version = "1.0.0"
edition = "2021"
authors = ["balajitechlabs <admin@balajitechlab.com>"]
license = "GPL-3.0"

[lib]
name = "btl_core"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
