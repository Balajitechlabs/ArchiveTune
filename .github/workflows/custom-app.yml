name: Build BTL Music Debug APK (Custom Edition)

on:
  push:
    branches:
      - 'custom-app'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-arm64:
    name: Build Arm64 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Arm64 Debug & Release APKs
        run: ./gradlew assembleGmsMobileArm64Debug assembleGmsMobileArm64Release --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btl-music-arm64-apks
          path: |
            app/build/outputs/apk/gmsMobileArm64/debug/*.apk
            app/build/outputs/apk/gmsMobileArm64/release/*.apk
          if-no-files-found: error
          retention-days: 30
